function box(
  w,
  h,
  d,
  mat,
  x,
  y,
  z,
  group=city
){

  const m=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    mat
  );

  m.position.set(
    x,
    y,
    z
  );

  m.castShadow=true;
  m.receiveShadow=true;

  group.add(m);

  return m;
}

function addBuilding(
  x,
  z,
  w,
  d,
  h
){

  const palette=[
    mats.concrete,
    mats.blue,
    mats.red,
    new THREE.MeshStandardMaterial({
      color:0x68727b
    })
  ];

  const body=box(
    w,
    h,
    d,
    palette[
      Math.floor(
        Math.random()*palette.length
      )
    ],
    x,
    h/2,
    z
  );

  buildings.push({
    mesh:body,
    x,
    z,
    w,
    d,
    h
  });


  const winMat=
    new THREE.MeshStandardMaterial({
      color:0x9ccbe0,
      emissive:0x7b22cc,
      emissiveIntensity:1.8,
      roughness:.25
    });


  const rows=Math.max(
    2,
    Math.min(
      7,
      Math.floor(h/24)
    )
  );

  const cols=Math.max(
    2,
    Math.min(
      6,
      Math.floor(w/16)
    )
  );


  for(
    let r=0;
    r<rows;
    r++
  ){

    for(
      let c=0;
      c<cols;
      c++
    ){

      const ww=Math.min(
        7,
        w/(cols+2)
      );

      const hh=5;

      const px=
        x-w/2+12+
        c*(w-24)/
        Math.max(1,cols-1);

      const py=
        8+
        r*(h-18)/
        Math.max(1,rows-1);

      if(py>h-5)continue;

      box(
        ww,
        .18,
        hh,
        winMat,
        px,
        py,
        z-d/2-.11
      );

      box(
        ww,
        .18,
        hh,
        winMat,
        px,
        py,
        z+d/2+.11
      );

    }

  }


  const sideCols=Math.max(
    2,
    Math.min(
      6,
      Math.floor(d/18)
    )
  );


  for(
    let r=0;
    r<rows;
    r++
  ){

    for(
      let c=0;
      c<sideCols;
      c++
    ){

      const dd=Math.min(
        7,
        d/(sideCols+2)
      );

      const hh=5;

      const pz=
        z-d/2+12+
        c*(d-24)/
        Math.max(1,sideCols-1);

      const py=
        8+
        r*(h-18)/
        Math.max(1,rows-1);


      box(
        .18,
        hh,
        dd,
        winMat,
        x-w/2-.11,
        py,
        pz
      );

      box(
        .18,
        hh,
        dd,
        winMat,
        x+w/2+.11,
        py,
        pz
      );

    }

  }

}

   ПАУТИНА
========================= */

function clearRope(){

  if(rope){

    rope.group.traverse(
      o=>{

        if(o.geometry)
          o.geometry.dispose();

        if(o.material)
          o.material.dispose();

      }
    );

    scene.remove(
      rope.group
    );

    rope=null;

  }

}


function makeRope(a,b){

  clearRope();

  const group=
    new THREE.Group();

  const dir=
    new THREE.Vector3()
      .subVectors(b,a);

  const len=
    dir.length();

  if(len<1)return;


  const mainGeo=
    new THREE.CylinderGeometry(
      .11,
      .11,
      len,
      10,
      1
    );

  const main=
    new THREE.Mesh(
      mainGeo,
      webMat
    );

  main.position.copy(
    a.clone()
      .add(b)
      .multiplyScalar(.5)
  );

  main.quaternion.setFromUnitVectors(
    new THREE.Vector3(0,1,0),
    dir.clone().normalize()
  );

  group.add(main);


  const side=
    new THREE.Vector3(
      -dir.z,
      0,
      dir.x
    );

  if(side.lengthSq()<.001)
    side.set(1,0,0);

  side.normalize();


  const steps=
    Math.min(
      18,
      Math.max(
        7,
        Math.floor(len/18)
      )
    );


  for(
    let i=1;
    i<steps;
    i++
  ){

    const t=i/steps;

    const center=
      a.clone().lerp(b,t);

    const width=
      .10+
      Math.sin(Math.PI*t)*.18;

    const p1=
      center.clone()
        .add(
          side.clone()
            .multiplyScalar(width)
        );

    const p2=
      center.clone()
        .sub(
          side.clone()
            .multiplyScalar(width)
        );

    const g=
      new THREE.BufferGeometry()
        .setFromPoints([
          p1,
          p2
        ]);

    const l=
      new THREE.Line(
        g,
        new THREE.LineBasicMaterial({
          color:0xffffff,
          transparent:true,
          opacity:.95
        })
      );

    group.add(l);

  }


  const fineGeo=
    new THREE.CylinderGeometry(
      .035,
      .035,
      len,
      6,
      1
    );

  const fine=
    new THREE.Mesh(
      fineGeo,
      new THREE.MeshBasicMaterial({
        color:0xffffff,
        transparent:true,
        opacity:.8
      })
    );

  fine.position.copy(
    main.position
  );

  fine.quaternion.copy(
    main.quaternion
  );

  group.add(fine);


  scene.add(group);

  rope={
    group,
    anchor:b.clone()
  };

}


/* =========================
   БЛИЖАЙШАЯ СТЕНА ЗДАНИЯ
========================= */

function nearestBuilding(){

  let best=null;
  let bestDistance=Infinity;
  let bestAnchor=null;
  let bestHangPoint=null;

  const p=player.position;

  for(
    const b of buildings
  ){

    const halfW=b.w/2;
    const halfD=b.d/2;

    const left=
      b.x-halfW;

    const right=
      b.x+halfW;

    const front=
      b.z-halfD;

    const back=
      b.z+halfD;


    /*
      Расстояние до каждой из
      четырёх стен здания.
    */

    const candidates=[
      {
        x:left-0.7,
        z:THREE.MathUtils.clamp(
          p.z,
          front+1,
          back-1
        ),
        distance:Math.abs(p.x-left)
      },
      {
        x:right+0.7,
        z:THREE.MathUtils.clamp(
          p.z,
          front+1,
          back-1
        ),
        distance:Math.abs(p.x-right)
      },
      {
        x:THREE.MathUtils.clamp(
          p.x,
          left+1,
          right-1
        ),
        z:front-0.7,
        distance:Math.abs(p.z-front)
      },
      {
        x:THREE.MathUtils.clamp(
          p.x,
          left+1,
          right-1
        ),
        z:back+0.7,
        distance:Math.abs(p.z-back)
      }
    ];


    for(
      const c of candidates
    ){

      /*
        Не цепляемся за стену,
        если она слишком далеко.
      */

      if(c.distance>900)
        continue;


      /*
        Высота точки зацепления.

        Она находится высоко,
        но всегда ниже крыши.
      */

      const anchorY=
        THREE.MathUtils.clamp(
          p.y+18,
          12,
          Math.max(
            12,
            b.h-4
          )
        );


      const anchor=
        new THREE.Vector3(
          c.x,
          anchorY,
          c.z
        );


      /*
        Направление наружу от стены.
      */

      const away=
        new THREE.Vector3(
          p.x-c.x,
          0,
          p.z-c.z
        );


      /*
        Для точной вертикальной стены
        используем сторону здания.
      */

      if(
        Math.abs(
          c.x-(left-0.7)
        )<.01
      ){

        away.set(
          -1,
          0,
          0
        );

      }
      else if(
        Math.abs(
          c.x-(right+0.7)
        )<.01
      ){

        away.set(
          1,
          0,
          0
        );

      }
      else if(
        Math.abs(
          c.z-(front-0.7)
        )<.01
      ){

        away.set(
          0,
          0,
          -1
        );

      }
      else{

        away.set(
          0,
          0,
          1
        );

      }


      /*
        Точка, где персонаж реально
        будет висеть возле стены.

        Она находится снаружи здания,
        а не внутри него.
      */

      const hangPoint=
        anchor.clone()
          .add(
            away.clone()
              .multiplyScalar(5)
          );

      hangPoint.y=
        Math.max(
          3.5,
          anchorY-7
        );


      /*
        Если эта стена ближе —
        сохраняем её.
      */

      if(
        c.distance<bestDistance
      ){

        bestDistance=c.distance;
        best=b;
        bestAnchor=anchor;
        bestHangPoint=hangPoint;

      }

    }

  }


  if(!best)
    return null;


  return {
    building:best,
    anchor:bestAnchor,
    hangPoint:bestHangPoint,
    distance:bestDistance
  };

}


/* =========================
   ЗАЦЕПЛЕНИЕ ПАУТИНОЙ
========================= */

function attachWeb(){

  /*
    Во время самого зацепления
    и во время трёх секунд висения
    повторное нажатие игнорируем.
  */

  if(
    webState==='attaching' ||
    webState==='hanging'
  )
    return;


  const found=
    nearestBuilding();


  if(!found){

    toast(
      "Рядом нет здания"
    );

    return;

  }


  ropeAnchor.copy(
    found.anchor
  );

  webHangPoint.copy(
    found.hangPoint
  );

  webAttachStart.copy(
    player.position
  );

  webAttachStartedAt=
    performance.now();


  /*
    Сначала короткое настоящее
    движение к стене.

    После этого начинается
    полноценное висение.
  */

  webState='attaching';

  onGround=false;

  vel.set(
    0,
    0,
    0
  );


  /*
    Сразу создаём паутину,
    чтобы было видно, куда
    персонаж цепляется.
  */

  makeRope(
    player.position.clone()
      .add(
        new THREE.Vector3(
          0,
          2.1,
          0
        )
      ),
    ropeAnchor
  );

}

/*

*/

const cols=60;
const rows=42;


for(

){

    gz%2===1;

      (Math.random()-.5)*20;

      ((D-500)/(rows-1))+
      (Math.random()-.5)*20;

      new THREE.Mesh(
        new THREE.RingGeometry(
          6,
          9,
          16
        ),
        missionMat
      );

      поэтому кольца висели
      в воздухе.

      Теперь они лежат прямо
      над поверхностью земли.

      Math.PI/2;

    m.position.set(

      .13,
      z
    );

    stick.setPointerCapture(
      e.pointerId
    );

    joyMove(e);

  }
);

  'pointermove',
  e=>{

    if(drag)
      joyMove(e);

  }
);

  'pointerup',
  ()=>{

    drag=false;

    joy={
      x:0,
      y:0
    };

    knob.style.transform=
      'translate(0,0)';

  }
);


function joyMove(e){

  const r=
    stick.getBoundingClientRect();

  const cx=
    r.left+r.width/2;

  const cy=
    r.top+r.height/2;

  let x=
    e.clientX-cx;

  let y=
    e.clientY-cy;

  const l=
    Math.hypot(x,y);

  const max=48;


  if(l>max){

    x=x/l*max;
    y=y/l*max;

  }


  joy={
    x:x/max,
    y:y/max
  };


  knob.style.transform=
    `translate(${x}px,${y}px)`;

}

function resolveBuildingCollisions(
  previousPosition
){

  const radius=.8;


  for(
    const b of buildings
  ){

    /*
      ПРИЗЕМЛЕНИЕ НА КРЫШУ

      В старой версии проверка
      была перепутана по направлению
      движения. Теперь нормально
      ловим момент, когда игрок
      падает с высоты выше крыши
      и пересекает высоту здания.
    */

    if(
      previousPosition.y>=b.h &&
      player.position.y<=b.h &&
      vel.y<=0 &&
      Math.abs(
        player.position.x-b.x
      )<=b.w/2+radius &&
      Math.abs(
        player.position.z-b.z
      )<=b.d/2+radius
    ){

      player.position.y=b.h;

      vel.y=0;

      onGround=true;

      continue;

    }


    /*
      Если игрок стоит выше крыши,
      стены здания снизу уже не
      должны мешать.
    */

    if(
      player.position.y>=b.h-.05
    ){

      continue;

    }


    const minX=
      b.x-b.w/2-radius;

    const maxX=
      b.x+b.w/2+radius;

    const minZ=
      b.z-b.d/2-radius;

    const maxZ=
      b.z+b.d/2+radius;


    if(
      player.position.x>minX &&
      player.position.x<maxX &&
      player.position.z>minZ &&
      player.position.z<maxZ
    ){

      const pushLeft=
        player.position.x-minX;

      const pushRight=
        maxX-player.position.x;

      const pushBack=
        player.position.z-minZ;

      const pushForward=
        maxZ-player.position.z;


      const minPush=
        Math.min(
          pushLeft,
          pushRight,
          pushBack,
          pushForward
        );


      if(
        minPush===pushLeft
      ){

        player.position.x=minX;

        vel.x=0;

      }
      else if(
        minPush===pushRight
      ){

        player.position.x=maxX;

        vel.x=0;

      }
      else if(
        minPush===pushBack
      ){

        player.position.z=minZ;

        vel.z=0;

      }
      else{

        player.position.z=maxZ;

        vel.z=0;

      }

    }

  }

}


/* =========================
   ИГРОВОЙ UPDATE
========================= */

function update(dt){

  if(
    !gameStarted ||
    paused
  )
    return;


  const previousPosition=
    player.position.clone();


  let ix=
    (keys.KeyD?1:0)-
    (keys.KeyA?1:0)+
    joy.x;


  let iz=
    (keys.KeyS?1:0)-
    (keys.KeyW?1:0)+
    joy.y;


  const input=
    new THREE.Vector3(
      ix,
      0,
      iz
    );


  if(
    input.lengthSq()>1
  )
    input.normalize();


  const speed=
    keys.ShiftLeft
      ? 22
      : 12;


  /* =====================
     ПАУТИНА: ПОДТЯГИВАНИЕ
  ===================== */

  if(
    webState==='attaching'
  ){

    /*
      Плавно переносим персонажа
      к реальной точке возле стены.
    */

    const elapsed=
      performance.now()-
      webAttachStartedAt;

    const t=
      THREE.MathUtils.clamp(
        elapsed/WEB_ATTACH_TIME,
        0,
        1
      );

    /*
      Плавное ускорение/замедление.
    */

    const smooth=
      t*t*(3-2*t);

    player.position.lerpVectors(
      webAttachStart,
      webHangPoint,
      smooth
    );

    vel.set(
      0,
      0,
      0
    );

    onGround=false;


    /*
      Когда дошли до стены —
      начинаем ровно 3 секунды
      настоящего висения.
    */

    if(t>=1){

      player.position.copy(
        webHangPoint
      );

      webState='hanging';

      hangingUntil=
        performance.now()+3000;

    }

  }


  /* =====================
     ПАУТИНА: 3 СЕКУНДЫ
  ===================== */

  else if(
    webState==='hanging'
  ){

    /*
      Полностью замораживаем
      персонажа.
    */

    player.position.copy(
      webHangPoint
    );

    vel.set(
      0,
      0,
      0
    );

    onGround=false;


    if(
      performance.now()>=
      hangingUntil
    ){

      clearRope();

      webState='falling';

      /*
        Небольшая начальная
        скорость вниз.
      */

      vel.y=-2.5;

    }

  }


  /* =====================
     ОБЫЧНОЕ ДВИЖЕНИЕ
  ===================== */

  else{

    vel.x=
      THREE.MathUtils.lerp(
        vel.x,
        input.x*speed,
        .14
      );

    vel.z=
      THREE.MathUtils.lerp(
        vel.z,
        input.z*speed,
        .14
      );


    if(
      input.lengthSq()>0
    ){

      /*
        Направление персонажа
        совпадает с направлением
        движения.

        Без +Math.PI.
      */

      const moveAngle=
        Math.atan2(
          input.x,
          -input.z
        );


      /*
        Плавный поворот вместо
        резкого вращения.

        Это убирает неприятный
        эффект при боковом движении.
      */

      let difference=
        moveAngle-
        player.rotation.y;


      while(
        difference>Math.PI
      )
        difference-=Math.PI*2;


      while(
        difference<-Math.PI
      )
        difference+=Math.PI*2;


      player.rotation.y+=
        difference*
        Math.min(
          1,
          dt*12
        );

    }

  }


  /*
    ЖЁСТКО запрещаем персонажу
    наклоняться назад/вперёд
    или вбок.

    Он может вращаться только
    вокруг вертикальной оси Y.
  */

  player.rotation.x=0;
  player.rotation.z=0;


  /* =====================
     ГРАВИТАЦИЯ
  ===================== */

  if(
    webState==='falling'
  ){

    /*
      Медленное падение.
    */

    vel.y-=8.5*dt;

  }
  else if(
    webState!=='hanging' &&
    webState!=='attaching'
  ){

    vel.y-=34*dt;

  }


  /* =====================
     ДВИЖЕНИЕ
  ===================== */

  if(
    webState!=='hanging' &&
    webState!=='attaching'
  ){

    player.position.addScaledVector(
      vel,
      dt
    );

  }


  /* =====================
     ЗЕМЛЯ
  ===================== */

  if(
    player.position.y<=0
  ){

    player.position.y=0;

    vel.y=0;

    onGround=true;

    if(
      webState==='falling'
    ){

      webState='none';

    }

  }
  else{

    onGround=false;

  }


  /*
    Пока паук зацепляется или
    висит, здания не должны
    вытолкнуть его из точки
    висения.
  */

  if(
    webState!=='attaching' &&
    webState!=='hanging'
  ){

    resolveBuildingCollisions(
      previousPosition
    );

  }


  /* =====================
     ГРАНИЦЫ ГОРОДА
  ===================== */

  if(
    player.position.x<
    -W/2+20
  )
    player.position.x=
      -W/2+20;


  if(
    player.position.x>
    W/2-20
  )
    player.position.x=
      W/2-20;


  if(
    player.position.z<
    -D/2+20
  )
    player.position.z=
      -D/2+20;


  if(
    player.position.z>
    D/2-20
  )
    player.position.z=
      D/2-20;


  /* =====================
     МИССИЯ
  ===================== */

  if(
    target &&
    player.position.distanceTo(
      target.position
    )<18
  ){

    target.visible=false;

    reward();

    target=
      updateMission();

    target.visible=true;

  }


  /* =====================
     ОБНОВЛЕНИЕ ПАУТИНЫ
  ===================== */

  if(rope){

    const a=
      player.position.clone()
        .add(
          new THREE.Vector3(
            0,
            2.1,
            0
          )
        );

    const b=
      ropeAnchor.clone();

    const d=
      new THREE.Vector3()
        .subVectors(
          b,
          a
        );

    const len=
      d.length();


    const main=
      rope.group.children[0];

    const fine=
      rope.group.children[
        rope.group.children.length-1
      ];


    const mid=
      a.clone()
        .add(b)
        .multiplyScalar(.5);


    main.position.copy(mid);


    main.scale.y=
      len/
      Math.max(
        .001,
        main.geometry.parameters.height
      );


    main.quaternion.setFromUnitVectors(
      new THREE.Vector3(0,1,0),
      d.clone().normalize()
    );


    fine.position.copy(
      mid
    );


    fine.scale.y=
      len/
      Math.max(
        .001,
        fine.geometry.parameters.height
      );


    fine.quaternion.copy(
      main.quaternion
    );

  }


  /* =====================
     МАШИНЫ
  ===================== */

  for(
    const c of cars
  ){

    c.position[
      c.userData.axis
    ]+=
      c.userData.dir*
      c.userData.speed*
      dt;


    const lim=
      c.userData.axis==='x'
        ? W/2
        : D/2;


    if(
      Math.abs(
        c.position[
          c.userData.axis
        ]
      )>lim+100
    ){

      c.position[
        c.userData.axis
      ]=
        -Math.sign(
          c.position[
            c.userData.axis
          ]
        )*
        (lim+80);

    }

  }


  /* =====================
     КАМЕРА
  ===================== */

  const camOffset=
    new THREE.Vector3(
      0,
      5.2,
      9.5
    )
    .applyAxisAngle(
      new THREE.Vector3(
        0,
        1,
        0
      ),
      player.rotation.y
    );


  const desired=
    player.position.clone()
      .add(camOffset);


  camera.position.lerp(
    desired,
    .12
  );


  camera.lookAt(
    player.position.clone()
      .add(
        new THREE.Vector3(
          0,
          1.8,
          0
        )
      )
  );

}


/* =========================
   GAME LOOP
========================= */

let last=
  performance.now();


function loop(t){

  requestAnimationFrame(
    loop
  );


  const dt=
    Math.min(
      .035,
      (t-last)/1000
    );


  last=t;


  update(dt);


  renderer.render(
    scene,
    camera
  );

}


loop(last);


/* =========================
   RESIZE
========================= */

addEventListener(
  'resize',
  ()=>{

    camera.aspect=
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);


/* =========================
   UNHANDLED ERRORS
========================= */

addEventListener(
  'unhandledrejection',
  e=>{

    e.preventDefault();

    toast(
      'Не удалось выполнить действие в браузере'
    );

  }
);

</script>

</body>
</html>
